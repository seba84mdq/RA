<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Test AR — Cámara + GPS + Brújula</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #000; font-family: -apple-system, system-ui, sans-serif; color: #fff; }

  /* Cámara */
  #cam {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    background: #000;
  }

  /* Overlay AR */
  #overlay { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  /* Crosshair central */
  .cross { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .cross::before, .cross::after {
    content: ""; position: absolute; background: rgba(0,255,140,.9);
    box-shadow: 0 0 8px rgba(0,255,140,.6);
  }
  .cross::before { width: 2px; height: 34px; left: -1px; top: -17px; }
  .cross::after  { width: 34px; height: 2px; top: -1px; left: -17px; }

  /* Panel de datos */
  #hud {
    position: fixed; left: 12px; right: 12px; top: 12px; z-index: 2;
    background: rgba(0,0,0,.55); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
    padding: 12px 14px; font-size: 13px; line-height: 1.55;
    display: grid; grid-template-columns: auto 1fr; gap: 2px 12px;
  }
  #hud .k { color: #8be9c4; font-weight: 600; }
  #hud .v { font-variant-numeric: tabular-nums; word-break: break-all; }
  #hud .ok  { color: #5cff9e; }
  #hud .err { color: #ff6b6b; }
  #hud .warn{ color: #ffd166; }

  /* Brújula */
  #compass {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2;
    width: 108px; height: 108px; border-radius: 50%;
    background: rgba(0,0,0,.55); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.15);
    display: flex; align-items: center; justify-content: center;
  }
  #needle {
    width: 0; height: 0;
    border-left: 12px solid transparent; border-right: 12px solid transparent;
    border-bottom: 44px solid #ff5252;
    transform-origin: 50% 100%;
    filter: drop-shadow(0 0 6px rgba(255,82,82,.6));
    transition: transform .08s linear;
  }
  #compass .n { position: absolute; top: 6px; font-size: 12px; font-weight: 700; color: #fff; }
  #heading {
    position: fixed; bottom: 4px; left: 50%; transform: translateX(-50%); z-index: 2;
    font-size: 12px; font-variant-numeric: tabular-nums; color: #ddd;
  }

  /* Botón de inicio */
  #start {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: radial-gradient(circle at 50% 40%, #10261f, #000);
    text-align: center; padding: 24px;
  }
  #start h1 { font-size: 20px; font-weight: 700; }
  #start p { font-size: 14px; color: #9aa; max-width: 300px; }
  #start button {
    pointer-events: auto;
    margin-top: 8px; padding: 14px 30px; font-size: 16px; font-weight: 700;
    color: #04140d; background: #5cff9e; border: none; border-radius: 30px;
    box-shadow: 0 6px 24px rgba(92,255,158,.35);
  }
  #start button:active { transform: scale(.97); }
  .hidden { display: none !important; }
</style>
</head>
<body>

  <video id="cam" autoplay playsinline muted></video>

  <div id="overlay">
    <div class="cross"></div>
  </div>

  <div id="hud">
    <span class="k">Cámara</span>   <span class="v" id="s-cam">—</span>
    <span class="k">GPS</span>      <span class="v" id="s-gps">—</span>
    <span class="k">Lat</span>      <span class="v" id="s-lat">—</span>
    <span class="k">Lon</span>      <span class="v" id="s-lon">—</span>
    <span class="k">Precisión</span><span class="v" id="s-acc">—</span>
    <span class="k">Altitud</span> <span class="v" id="s-alt">—</span>
    <span class="k">Brújula</span> <span class="v" id="s-head">—</span>
  </div>

  <div id="compass">
    <span class="n">N</span>
    <div id="needle"></div>
  </div>
  <div id="heading">—</div>

  <div id="start">
    <h1>Test AR</h1>
    <p>Probá cámara trasera, GPS y brújula desde el navegador del celular.</p>
    <button id="startBtn">Iniciar</button>
    <p style="font-size:12px;color:#667">Requiere HTTPS. Concedé los permisos cuando el navegador los pida.</p>
  </div>

<script>
const $ = id => document.getElementById(id);
const set = (id, txt, cls) => { const e = $(id); e.textContent = txt; e.className = 'v' + (cls ? ' ' + cls : ''); };

// ---------- CÁMARA ----------
async function initCamera() {
  set('s-cam', 'iniciando…', 'warn');
  if (!navigator.mediaDevices?.getUserMedia) {
    set('s-cam', 'no soportado', 'err'); return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    $('cam').srcObject = stream;
    const track = stream.getVideoTracks()[0];
    set('s-cam', 'OK · ' + (track.getSettings().width || '?') + 'px', 'ok');
  } catch (e) {
    set('s-cam', e.name + (e.message ? ' — ' + e.message : ''), 'err');
  }
}

// ---------- GPS ----------
function initGPS() {
  set('s-gps', 'buscando…', 'warn');
  if (!navigator.geolocation) { set('s-gps', 'no soportado', 'err'); return; }
  navigator.geolocation.watchPosition(
    p => {
      const c = p.coords;
      set('s-gps', 'OK', 'ok');
      set('s-lat', c.latitude.toFixed(6));
      set('s-lon', c.longitude.toFixed(6));
      set('s-acc', '±' + Math.round(c.accuracy) + ' m', c.accuracy < 30 ? 'ok' : 'warn');
      set('s-alt', c.altitude != null ? Math.round(c.altitude) + ' m' : 'n/d');
    },
    err => set('s-gps', err.message, 'err'),
    { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
  );
}

// ---------- BRÚJULA ----------
function applyHeading(h) {
  if (h == null || isNaN(h)) return;
  set('s-head', Math.round(h) + '°', 'ok');
  $('needle').style.transform = 'rotate(' + (-h) + 'deg)';
  $('heading').textContent = Math.round(h) + '°  ' + dir(h);
}
function dir(h) {
  const d = ['N','NE','E','SE','S','SO','O','NO'];
  return d[Math.round(h / 45) % 8];
}
function onOrient(e) {
  // iOS entrega webkitCompassHeading (0 = Norte, en sentido horario)
  let h = null;
  if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;
  else if (e.absolute && typeof e.alpha === 'number') h = 360 - e.alpha; // Android: alpha 0=N antihorario
  applyHeading(h);
}
async function initCompass() {
  set('s-head', 'iniciando…', 'warn');
  try {
    // iOS 13+ pide permiso explícito, con gesto del usuario
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== 'granted') { set('s-head', 'permiso denegado', 'err'); return; }
      window.addEventListener('deviceorientation', onOrient);
    } else if ('ondeviceorientationabsolute' in window) {
      window.addEventListener('deviceorientationabsolute', onOrient);
    } else if ('ondeviceorientation' in window) {
      window.addEventListener('deviceorientation', onOrient);
    } else {
      set('s-head', 'no soportado', 'err');
    }
  } catch (e) { set('s-head', e.message, 'err'); }
}

// ---------- ARRANQUE (necesita gesto del usuario) ----------
$('startBtn').addEventListener('click', async () => {
  $('start').classList.add('hidden');
  await initCamera();   // permiso cámara
  initGPS();            // permiso ubicación
  await initCompass();  // permiso orientación (iOS)
});
</script>
</body>
</html>
