<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AR WebXR</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#000; font-family:-apple-system,system-ui,sans-serif; color:#fff; }

  /* overlay: TODO lo visible durante AR va aca adentro */
  #overlay { position:fixed; inset:0; z-index:5; }

  #ver { position:absolute; top:10px; right:10px; background:rgba(0,0,0,.5); padding:3px 8px; border-radius:8px; font-size:11px; color:#5cff9e; }
  #status { position:absolute; top:10px; left:10px; background:rgba(0,0,0,.5); backdrop-filter:blur(8px); border-radius:10px; padding:6px 10px; font-size:12px; max-width:65%; }
  #hint { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,.55); border-radius:12px; padding:10px 16px; font-size:13px; text-align:center; }

  #panel { position:absolute; left:10px; right:10px; bottom:12px;
    background:rgba(0,0,0,.6); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:12px 14px;
    display:flex; flex-direction:column; gap:9px; }
  .row { display:flex; align-items:center; gap:10px; }
  .row label { font-size:12px; color:#cde; min-width:76px; }
  input[type=range]{ flex:1; accent-color:#5cff9e; height:26px; }
  .val { font-size:12px; color:#8be9c4; width:44px; text-align:right; font-variant-numeric:tabular-nums; }
  .btns { display:flex; gap:8px; }
  .btn { flex:1; padding:11px 6px; font-size:13px; font-weight:700; border:none; border-radius:20px; color:#04140d; background:#5cff9e; }
  .btn.sec { background:rgba(255,255,255,.14); color:#fff; }
  .btn:active{ transform:scale(.97); }

  #gear { position:absolute; bottom:20px; right:16px; width:52px; height:52px; border-radius:50%;
    border:none; background:rgba(0,0,0,.65); color:#fff; font-size:24px; display:none; }

  #toast { position:absolute; bottom:210px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.78); border-radius:20px; padding:8px 16px; font-size:13px;
    opacity:0; transition:opacity .25s; pointer-events:none; text-align:center; }
  #toast.show{ opacity:1; }

  /* pantalla inicio */
  #start { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(circle at 50% 35%,#10261f,#000); text-align:center; padding:24px; }
  #start h1{ font-size:22px; } #start p{ font-size:13px; color:#9aa; max-width:330px; }
  .modelbtns { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:4px; }
  .mbtn { padding:10px 14px; font-size:13px; font-weight:700; border:2px solid transparent;
    border-radius:16px; background:rgba(255,255,255,.12); color:#fff; }
  .mbtn.on { border-color:#5cff9e; color:#5cff9e; }
  #sel { font-size:13px; color:#8be9c4; min-height:18px; }
  #startBtn { margin-top:8px; padding:15px 40px; font-size:16px; font-weight:700; color:#04140d;
    background:#5cff9e; border:none; border-radius:30px; box-shadow:0 6px 24px rgba(92,255,158,.35); }
  #startBtn:disabled{ opacity:.5; }
  #startBtn:active{ transform:scale(.97); }
  #nosupport { color:#ff8a8a; font-size:13px; margin-top:6px; max-width:330px; }
  #file { display:none; }
  .hidden{ display:none!important; }
</style>
</head>
<body>

<div id="overlay" class="hidden">
  <div id="ver">v8 XR</div>
  <div id="status">Iniciando...</div>
  <div id="hint">Apunta al piso y toca para colocar</div>

  <div id="panel">
    <div class="row">
      <label>Opacidad</label>
      <input type="range" id="opacity" min="0" max="100" value="100">
      <span class="val" id="opacityVal">100%</span>
    </div>
    <div class="row">
      <label>Altura</label>
      <input type="range" id="height" min="-50" max="100" value="0">
      <span class="val" id="heightVal">0</span>
    </div>
    <div class="btns">
      <button class="btn" id="replace">Recolocar</button>
      <button class="btn sec" id="present">Presentar</button>
    </div>
    <div class="btns">
      <button class="btn sec" id="x-ghost">&#128123;</button>
      <button class="btn sec" id="x-duck">&#128036; Pato</button>
      <button class="btn sec" id="x-helmet">&#129686; Casco</button>
    </div>
  </div>

  <button id="gear">&#9881;</button>
  <div id="toast"></div>
</div>

<div id="start">
  <h1>&#128123; AR WebXR</h1>
  <p>1) Elegi un modelo. 2) Inicia AR. 3) Toca el piso para colocarlo. Camina alrededor para verlo de todos lados. Gestos: 1 dedo mueve, 2 dedos escala y rota.</p>
  <div class="modelbtns">
    <button class="mbtn on" id="s-ghost">&#128123; Fantasma</button>
    <button class="mbtn" id="s-duck">&#128036; Pato</button>
    <button class="mbtn" id="s-helmet">&#129686; Casco</button>
    <button class="mbtn" id="s-file">&#128193; Mi archivo</button>
  </div>
  <div id="sel">Modelo: Fantasma</div>
  <button id="startBtn">Iniciar AR</button>
  <div id="nosupport" class="hidden"></div>
  <input type="file" id="file" multiple>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/XREstimatedLight.js"></script>
<script>
const $ = id => document.getElementById(id);
const toast = m => { const t=$('toast'); if(!t) return; t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1400); };
const status = m => { const s=$('status'); if(s) s.textContent=m; };

let renderer, scene, camera, reticle, content, defaultLight;
let hitTestSource=null, localSpace=null, viewerSpace=null;
let placed=false, materials=[];
let baseY=0, heightOffset=0;
let selectedObject=null;   // modelo elegido en la pantalla de inicio

/* ===== fantasma default ===== */
function buildGhost(){
  const g=new THREE.Group();
  const pts=[new THREE.Vector2(0,0),new THREE.Vector2(0.46,0.02),new THREE.Vector2(0.5,0.4),
    new THREE.Vector2(0.5,0.95),new THREE.Vector2(0.42,1.3),new THREE.Vector2(0.26,1.55),new THREE.Vector2(0,1.62)];
  const mat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x223355,emissiveIntensity:0.3,transparent:true,opacity:1,side:THREE.DoubleSide,roughness:0.9});
  g.add(new THREE.Mesh(new THREE.LatheGeometry(pts,40),mat));
  const dk=new THREE.MeshBasicMaterial({color:0x0a0a1a}); const eg=new THREE.SphereGeometry(0.09,16,16);
  const l=new THREE.Mesh(eg,dk); l.position.set(-0.16,1.15,0.44); g.add(l);
  const r=new THREE.Mesh(eg,dk); r.position.set(0.16,1.15,0.44); g.add(r);
  const mo=new THREE.Mesh(new THREE.SphereGeometry(0.08,16,16),dk); mo.position.set(0,0.92,0.46); mo.scale.set(1,1.3,0.6); g.add(mo);
  normalizeObj(g,0.4);
  return g;
}

/* ===== helpers ===== */
function normalizeObj(obj,targetH){
  let box=new THREE.Box3().setFromObject(obj), s=new THREE.Vector3(); box.getSize(s);
  const k=(targetH||0.4)/(Math.max(s.x,s.y,s.z)||1); obj.scale.setScalar(k);
  box=new THREE.Box3().setFromObject(obj); const c=new THREE.Vector3(); box.getCenter(c);
  obj.position.x-=c.x; obj.position.z-=c.z; obj.position.y-=box.min.y;
}
function collectMaterials(obj){
  materials=[];
  obj.traverse(o=>{ if(o.isMesh&&o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>materials.push(m)); });
  if($('opacity')) applyOpacity(+$('opacity').value/100);
}
function applyOpacity(v){ materials.forEach(m=>{ m.transparent=v<0.999; m.opacity=v; m.needsUpdate=true; }); }
function applyHeight(){ if(placed&&content) content.position.y=baseY+heightOffset; }

/* poner un objeto como contenido activo (envuelto para no perder transform) */
function setContent(obj){
  if(!content) return;
  content.clear();
  const wrap=new THREE.Group(); wrap.add(obj);
  content.add(wrap);
  content.scale.setScalar(1); content.rotation.set(0,0,0);
  collectMaterials(content);
}

/* ===== loaders que devuelven un Object3D por callback ===== */
function loadSample(url,cb){
  new THREE.GLTFLoader().load(url,g=>{ const o=g.scene; normalizeObj(o,0.4); cb(o); },null,e=>{console.error(e);toast('Error de carga');});
}
function loadFiles(files,cb){
  const arr=[...files];
  const main=arr.find(f=>/\.(glb|gltf|obj|stl)$/i.test(f.name));
  if(!main){ toast('Elegi un .glb / .obj / .stl'); return; }
  const ext=main.name.split('.').pop().toLowerCase();
  const url=URL.createObjectURL(main);
  const tex=arr.find(f=>/\.(png|jpg|jpeg|webp)$/i.test(f.name));
  const err=e=>{ console.error(e); toast('Error al cargar'); };
  const ready=o=>{ normalizeObj(o,0.4); cb(o); };
  try{
    if(ext==='glb'||ext==='gltf'){
      new THREE.GLTFLoader().load(url,g=>{ ready(g.scene); URL.revokeObjectURL(url); },null,err);
    } else if(ext==='obj'){
      new THREE.OBJLoader().load(url,o=>{
        if(tex){
          const turl=URL.createObjectURL(tex);
          new THREE.TextureLoader().load(turl,t=>{ t.encoding=THREE.sRGBEncoding;
            o.traverse(m=>{ if(m.isMesh) m.material=new THREE.MeshStandardMaterial({map:t,roughness:0.8}); });
            ready(o); URL.revokeObjectURL(turl); URL.revokeObjectURL(url);
          });
        } else {
          o.traverse(m=>{ if(m.isMesh&&(!m.material||!m.material.isMeshStandardMaterial)) m.material=new THREE.MeshStandardMaterial({color:0xcccccc,roughness:0.8}); });
          ready(o); URL.revokeObjectURL(url);
        }
      },null,err);
    } else if(ext==='stl'){
      new THREE.STLLoader().load(url,geo=>{ geo.computeVertexNormals();
        ready(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xbfc4cc,roughness:0.6,metalness:0.1}))); URL.revokeObjectURL(url);
      },null,err);
    }
  }catch(e){ err(e); }
}

const SAMPLES={
  duck:'https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/Duck/glTF-Binary/Duck.glb',
  helmet:'https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/DamagedHelmet/glTF-Binary/DamagedHelmet.glb'
};

/* ===== seleccion en pantalla de inicio ===== */
function pick(btnId,label){ document.querySelectorAll('.mbtn').forEach(b=>b.classList.remove('on')); $(btnId).classList.add('on'); $('sel').textContent='Modelo: '+label; }
$('s-ghost').addEventListener('click',()=>{ selectedObject=null; pick('s-ghost','Fantasma'); });
$('s-duck').addEventListener('click',()=>{ pick('s-duck','Pato (cargando...)'); loadSample(SAMPLES.duck,o=>{ selectedObject=o; $('sel').textContent='Modelo: Pato'; }); });
$('s-helmet').addEventListener('click',()=>{ pick('s-helmet','Casco (cargando...)'); loadSample(SAMPLES.helmet,o=>{ selectedObject=o; $('sel').textContent='Modelo: Casco'; }); });
$('s-file').addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',e=>{ if(e.target.files.length){ pick('s-file','archivo (cargando...)'); loadFiles(e.target.files,o=>{ selectedObject=o; $('sel').textContent='Modelo: '+e.target.files[0].name; }); } });

/* ===== iniciar AR ===== */
async function startAR(){
  if(!navigator.xr){ noSupport('Sin WebXR. Usa Chrome actualizado.'); return; }
  const ok=await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);
  if(!ok){ noSupport('immersive-ar no soportado. Instala/activa Google Play Services for AR.'); return; }

  renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(innerWidth,innerHeight);
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.xr.enabled=true;
  document.body.appendChild(renderer.domElement);
  renderer.domElement.style.position='fixed'; renderer.domElement.style.inset='0'; renderer.domElement.style.zIndex='1';

  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.01,20);

  defaultLight=new THREE.Group();
  defaultLight.add(new THREE.HemisphereLight(0xffffff,0x445566,1.0));
  const dir=new THREE.DirectionalLight(0xffffff,0.8); dir.position.set(0.5,1,0.25); defaultLight.add(dir);
  scene.add(defaultLight);

  if(typeof THREE.XREstimatedLight==='function'){
    const xrLight=new THREE.XREstimatedLight(renderer);
    xrLight.addEventListener('estimationstart',()=>{ scene.add(xrLight); scene.remove(defaultLight); if(xrLight.environment) scene.environment=xrLight.environment; });
    xrLight.addEventListener('estimationend',()=>{ scene.add(defaultLight); scene.remove(xrLight); scene.environment=null; });
  }

  reticle=new THREE.Mesh(new THREE.RingGeometry(0.07,0.09,32).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({color:0x5cff9e}));
  reticle.matrixAutoUpdate=false; reticle.visible=false; scene.add(reticle);

  content=new THREE.Group(); content.visible=false; scene.add(content);
  setContent(selectedObject || buildGhost());

  let session;
  try{
    session=await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['hit-test'],
      optionalFeatures:['dom-overlay','light-estimation','local-floor'],
      domOverlay:{ root: $('overlay') }
    });
  }catch(e){ noSupport('No inicia AR: '+e.message); return; }

  $('start').classList.add('hidden');
  $('overlay').classList.remove('hidden');
  // reset UI de sesion
  $('panel').classList.remove('hidden'); $('status').classList.remove('hidden'); $('gear').style.display='none';
  $('hint').classList.remove('hidden');
  placed=false; if(content) content.visible=false;

  await renderer.xr.setSession(session);
  localSpace=await session.requestReferenceSpace('local');
  viewerSpace=await session.requestReferenceSpace('viewer');
  hitTestSource=await session.requestHitTestSource({ space: viewerSpace });
  status('Movete apuntando al piso...');

  session.addEventListener('select',()=>{
    if(!placed && reticle.visible){
      content.position.setFromMatrixPosition(reticle.matrix);
      baseY=content.position.y; heightOffset=0; $('height').value=0; $('heightVal').textContent='0';
      content.visible=true; placed=true; $('hint').classList.add('hidden');
      status('Listo. Camina alrededor. 1 dedo mueve, 2 escala/rota.');
      toast('Objeto colocado');
    }
  });

  session.addEventListener('end',()=>{
    $('overlay').classList.add('hidden'); $('start').classList.remove('hidden');
    placed=false; hitTestSource=null;
    if(renderer&&renderer.domElement&&renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
  });

  renderer.setAnimationLoop(render);
  setupGestures();
}

function render(t,frame){
  if(frame && hitTestSource && !placed){
    const res=frame.getHitTestResults(hitTestSource);
    if(res.length){ const pose=res[0].getPose(localSpace); reticle.visible=true; reticle.matrix.fromArray(pose.transform.matrix); status('Superficie lista. Toca para colocar.'); }
    else { reticle.visible=false; }
  } else if(reticle) reticle.visible=false;
  renderer.render(scene,camera);
}

/* ===== gestos ===== */
function setupGestures(){
  const ov=$('overlay'); let mode=0,sx=0,sy=0,sD=0,sA=0,sS=1,sR=0;
  const inUI=el=>el.closest('#panel')||el.closest('#gear')||el.closest('button')||el.closest('input');
  ov.addEventListener('beforexrselect',e=>{ if(inUI(e.target)) e.preventDefault(); });
  ov.addEventListener('touchstart',e=>{
    if(!placed||inUI(e.target)) return;
    if(e.touches.length===1){ mode=1; sx=e.touches[0].clientX; sy=e.touches[0].clientY; }
    else if(e.touches.length===2){ mode=2; const a=e.touches[0],b=e.touches[1];
      sD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY); sA=Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX);
      sS=content.scale.x; sR=content.rotation.y; }
  },{passive:true});
  ov.addEventListener('touchmove',e=>{
    if(!placed||inUI(e.target)) return;
    if(mode===1&&e.touches.length===1){
      const dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy; sx=e.touches[0].clientX; sy=e.touches[0].clientY;
      const cam=renderer.xr.getCamera(camera); const fwd=new THREE.Vector3(); cam.getWorldDirection(fwd); fwd.y=0; fwd.normalize();
      const right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).normalize().multiplyScalar(-1);
      const k=0.0016; content.position.addScaledVector(right,dx*k); content.position.addScaledVector(fwd,-dy*k);
    } else if(mode===2&&e.touches.length===2){
      const a=e.touches[0],b=e.touches[1];
      const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY), ang=Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX);
      content.scale.setScalar(Math.min(6,Math.max(0.05,sS*(d/sD)))); content.rotation.y=sR+(ang-sA);
    }
  },{passive:true});
  ov.addEventListener('touchend',e=>{ if(e.touches.length===0) mode=0; },{passive:true});
}

function noSupport(msg){ const n=$('nosupport'); n.textContent=msg; n.classList.remove('hidden'); }

/* ===== controles dentro de AR ===== */
$('opacity').addEventListener('input',e=>{ const v=+e.target.value; $('opacityVal').textContent=v+'%'; applyOpacity(v/100); });
$('height').addEventListener('input',e=>{ const v=+e.target.value; $('heightVal').textContent=v; heightOffset=v/100; applyHeight(); });
$('replace').addEventListener('click',()=>{ placed=false; if(content) content.visible=false; $('hint').classList.remove('hidden'); status('Toca para recolocar.'); });
$('present').addEventListener('click',()=>{ $('panel').classList.add('hidden'); $('status').classList.add('hidden'); $('gear').style.display='block'; });
$('gear').addEventListener('click',()=>{ $('panel').classList.remove('hidden'); $('status').classList.remove('hidden'); $('gear').style.display='none'; });
/* swap seguro dentro de AR (samples/ghost, sin explorador) */
$('x-ghost').addEventListener('click',()=>{ setContent(buildGhost()); if(placed) applyHeight(); toast('Fantasma'); });
$('x-duck').addEventListener('click',()=>{ toast('Cargando Pato...'); loadSample(SAMPLES.duck,o=>{ setContent(o); if(placed) applyHeight(); toast('Pato'); }); });
$('x-helmet').addEventListener('click',()=>{ toast('Cargando Casco...'); loadSample(SAMPLES.helmet,o=>{ setContent(o); if(placed) applyHeight(); toast('Casco'); }); });

$('startBtn').addEventListener('click',startAR);
</script>
</body>
</html>
