<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AR — Fantasma anclado</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#000; font-family:-apple-system,system-ui,sans-serif; color:#fff; }

  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; background:#000; }
  #gl  { position:fixed; inset:0; width:100%; height:100%; z-index:1; }

  .cross { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:2; pointer-events:none; }
  .cross::before,.cross::after{ content:""; position:absolute; background:rgba(0,255,140,.7); }
  .cross::before{ width:2px; height:22px; left:-1px; top:-11px; }
  .cross::after { width:22px; height:2px; top:-1px; left:-11px; }

  #hud {
    position:fixed; left:10px; top:10px; z-index:3;
    background:rgba(0,0,0,.5); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.12); border-radius:12px;
    padding:8px 11px; font-size:12px; line-height:1.5;
    display:grid; grid-template-columns:auto 1fr; gap:1px 10px;
  }
  #hud .k{ color:#8be9c4; font-weight:600; }
  #hud .v{ font-variant-numeric:tabular-nums; }
  .ok{color:#5cff9e}.err{color:#ff6b6b}.warn{color:#ffd166}

  #drop {
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%); z-index:4;
    padding:15px 28px; font-size:16px; font-weight:700; color:#04140d;
    background:#5cff9e; border:none; border-radius:30px;
    box-shadow:0 6px 24px rgba(92,255,158,.4);
  }
  #drop:active{ transform:translateX(-50%) scale(.96); }

  #toast {
    position:fixed; bottom:92px; left:50%; transform:translateX(-50%); z-index:4;
    background:rgba(0,0,0,.7); border-radius:20px; padding:8px 16px; font-size:13px;
    opacity:0; transition:opacity .25s; pointer-events:none;
  }
  #toast.show{ opacity:1; }

  #start {
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; background:radial-gradient(circle at 50% 40%,#10261f,#000); text-align:center; padding:24px;
  }
  #start h1{ font-size:21px; } #start p{ font-size:14px; color:#9aa; max-width:300px; }
  #start button{
    margin-top:6px; padding:14px 30px; font-size:16px; font-weight:700; color:#04140d;
    background:#5cff9e; border:none; border-radius:30px; box-shadow:0 6px 24px rgba(92,255,158,.35);
  }
  #start button:active{ transform:scale(.97); }
  .hidden{ display:none!important; }
</style>
</head>
<body>

  <video id="cam" autoplay playsinline muted></video>
  <canvas id="gl"></canvas>
  <div class="cross"></div>

  <div id="hud">
    <span class="k">Camara</span> <span class="v" id="s-cam">-</span>
    <span class="k">GPS</span>    <span class="v" id="s-gps">-</span>
    <span class="k">Brujula</span><span class="v" id="s-head">-</span>
    <span class="k">Distancia</span><span class="v" id="s-dist">-</span>
  </div>

  <button id="drop" class="hidden">&#128123; Reubicar aca</button>
  <div id="toast">Fantasma reubicado</div>

  <div id="start">
    <h1>&#128123; AR Fantasma</h1>
    <p>Deja un fantasma flotando en el espacio. Gira el telefono y va a seguir ahi, quieto.</p>
    <button id="startBtn">Iniciar</button>
    <p style="font-size:12px;color:#667">Requiere HTTPS. Aceta camara, ubicacion y movimiento.</p>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const set = (id,t,c)=>{ const e=$(id); e.textContent=t; e.className='v'+(c?' '+c:''); };
const DEG = Math.PI/180;

/* ============ CAMARA ============ */
async function initCamera(){
  set('s-cam','iniciando...','warn');
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false });
    $('cam').srcObject = stream;
    set('s-cam','OK','ok');
  }catch(e){ set('s-cam', e.name,'err'); }
}

/* ============ THREE.JS ============ */
let renderer, scene, camera, ghost, ghostAnchor;
const camPos = new THREE.Vector3(0,0,0);
const targetPos = new THREE.Vector3(0,0,0);

function buildGhost(){
  const g = new THREE.Group();
  const pts = [
    new THREE.Vector2(0.00, 0.00),
    new THREE.Vector2(0.46, 0.02),
    new THREE.Vector2(0.50, 0.40),
    new THREE.Vector2(0.50, 0.95),
    new THREE.Vector2(0.42, 1.30),
    new THREE.Vector2(0.26, 1.55),
    new THREE.Vector2(0.00, 1.62),
  ];
  const bodyGeo = new THREE.LatheGeometry(pts, 40);
  const bodyMat = new THREE.MeshStandardMaterial({
    color:0xffffff, emissive:0x223355, emissiveIntensity:0.5,
    transparent:true, opacity:0.82, side:THREE.DoubleSide, roughness:0.9, metalness:0
  });
  g.add(new THREE.Mesh(bodyGeo, bodyMat));

  const dark = new THREE.MeshBasicMaterial({ color:0x0a0a1a });
  const eyeGeo = new THREE.SphereGeometry(0.09, 16, 16);
  const eyeL = new THREE.Mesh(eyeGeo, dark); eyeL.position.set(-0.16,1.15,0.44); g.add(eyeL);
  const eyeR = new THREE.Mesh(eyeGeo, dark); eyeR.position.set( 0.16,1.15,0.44); g.add(eyeR);
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.08,16,16), dark);
  mouth.position.set(0,0.92,0.46); mouth.scale.set(1,1.3,0.6); g.add(mouth);

  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(0.9,24,24),
    new THREE.MeshBasicMaterial({ color:0x6ea8ff, transparent:true, opacity:0.06 })
  );
  halo.position.y = 0.9; g.add(halo);

  g.position.y = -0.8;
  const wrap = new THREE.Group();
  wrap.add(g);
  return wrap;
}

function initThree(){
  const canvas = $('gl');
  renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(72, window.innerWidth/window.innerHeight, 0.1, 1000);

  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  const dir = new THREE.DirectionalLight(0xffffff, 0.7); dir.position.set(1,2,1); scene.add(dir);

  ghost = buildGhost();
  scene.add(ghost);
  ghostAnchor = new THREE.Vector3(0, 0, -3);
  ghost.position.copy(ghostAnchor);

  window.addEventListener('resize', onResize);
  animate();
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

let devOri = null;
const zee = new THREE.Vector3(0,0,1);
const q0 = new THREE.Quaternion();
const q1 = new THREE.Quaternion(-Math.sqrt(0.5),0,0,Math.sqrt(0.5));
const euler = new THREE.Euler();
function screenOrient(){ return ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * DEG; }
function applyDeviceQuat(){
  if(!devOri) return;
  const a=(devOri.alpha||0)*DEG, b=(devOri.beta||0)*DEG, g=(devOri.gamma||0)*DEG, o=screenOrient();
  euler.set(b, a, -g, 'YXZ');
  camera.quaternion.setFromEuler(euler);
  camera.quaternion.multiply(q1);
  camera.quaternion.multiply(q0.setFromAxisAngle(zee, -o));
}
function onOrient(e){
  devOri = e;
  let h = (typeof e.webkitCompassHeading==='number') ? e.webkitCompassHeading
        : (e.absolute && e.alpha!=null) ? 360-e.alpha : null;
  if(h!=null) set('s-head', Math.round(h)+'\u00b0','ok');
}

let origin = null;
function initGPS(){
  set('s-gps','buscando...','warn');
  if(!navigator.geolocation){ set('s-gps','no soportado','err'); return; }
  navigator.geolocation.watchPosition(p=>{
    const c=p.coords;
    if(!origin) origin={ lat:c.latitude, lon:c.longitude };
    const north=(c.latitude-origin.lat)*111320;
    const east =(c.longitude-origin.lon)*111320*Math.cos(origin.lat*DEG);
    targetPos.set(east, 0, -north);
    set('s-gps','\u00b1'+Math.round(c.accuracy)+' m', c.accuracy<25?'ok':'warn');
  }, err=>set('s-gps',err.message,'err'), { enableHighAccuracy:true, maximumAge:0, timeout:15000 });
}

function dropGhost(){
  const fwd = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  fwd.y = 0;
  if(fwd.lengthSq()<1e-6) fwd.set(0,0,-1);
  fwd.normalize();
  ghostAnchor.copy(camPos).addScaledVector(fwd, 3);
  ghostAnchor.y = 0;
  const t=$('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1100);
}

let tPrev=0;
function animate(t){
  requestAnimationFrame(animate);

  camPos.lerp(targetPos, 0.06);
  camera.position.copy(camPos);
  applyDeviceQuat();

  const bob = Math.sin(t*0.002)*0.12;
  ghost.position.set(ghostAnchor.x, ghostAnchor.y+bob, ghostAnchor.z);
  const look = new THREE.Vector3(camera.position.x, ghost.position.y, camera.position.z);
  ghost.lookAt(look);

  const d = camera.position.distanceTo(ghost.position);
  set('s-dist', d.toFixed(1)+' m');

  renderer.render(scene, camera);
  tPrev=t;
}

$('startBtn').addEventListener('click', async ()=>{
  $('start').classList.add('hidden');
  $('drop').classList.remove('hidden');
  await initCamera();
  initThree();
  initGPS();
  try{
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r==='granted') window.addEventListener('deviceorientation', onOrient);
      else set('s-head','permiso denegado','err');
    } else if('ondeviceorientationabsolute' in window){
      window.addEventListener('deviceorientationabsolute', onOrient);
    } else {
      window.addEventListener('deviceorientation', onOrient);
    }
  }catch(e){ set('s-head', e.message,'err'); }
});

$('drop').addEventListener('click', dropGhost);
</script>
</body>
</html>
