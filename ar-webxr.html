<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AR WebXR</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#000; font-family:-apple-system,system-ui,sans-serif; color:#fff; }

  #overlay { position:fixed; inset:0; z-index:5; }

  #ver { position:fixed; top:10px; right:10px; z-index:9; background:rgba(0,0,0,.5);
    padding:3px 8px; border-radius:8px; font-size:11px; color:#5cff9e; }

  #status { position:fixed; top:10px; left:10px; z-index:8; background:rgba(0,0,0,.5);
    backdrop-filter:blur(8px); border-radius:10px; padding:6px 10px; font-size:12px; max-width:70%; }

  #hint { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:7;
    background:rgba(0,0,0,.55); border-radius:12px; padding:10px 16px; font-size:13px; text-align:center; }

  #panel { position:fixed; left:10px; right:10px; bottom:12px; z-index:8;
    background:rgba(0,0,0,.58); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:12px 14px;
    display:flex; flex-direction:column; gap:9px; }
  .row { display:flex; align-items:center; gap:10px; }
  .row label { font-size:12px; color:#cde; min-width:76px; }
  input[type=range]{ flex:1; accent-color:#5cff9e; height:26px; }
  .val { font-size:12px; color:#8be9c4; width:44px; text-align:right; font-variant-numeric:tabular-nums; }
  .btns { display:flex; gap:8px; }
  .btn { flex:1; padding:11px 6px; font-size:13px; font-weight:700; border:none; border-radius:20px; color:#04140d; background:#5cff9e; }
  .btn.sec { background:rgba(255,255,255,.14); color:#fff; }
  .btn:active{ transform:scale(.97); }
  #file { display:none; }

  #gear { position:fixed; bottom:20px; right:16px; z-index:8; width:52px; height:52px; border-radius:50%;
    border:none; background:rgba(0,0,0,.6); color:#fff; font-size:24px; display:none; }

  #toast { position:fixed; bottom:200px; left:50%; transform:translateX(-50%); z-index:9;
    background:rgba(0,0,0,.75); border-radius:20px; padding:8px 16px; font-size:13px;
    opacity:0; transition:opacity .25s; pointer-events:none; text-align:center; }
  #toast.show{ opacity:1; }

  #start { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px;
    background:radial-gradient(circle at 50% 40%,#10261f,#000); text-align:center; padding:24px; }
  #start h1{ font-size:22px; } #start p{ font-size:14px; color:#9aa; max-width:320px; }
  #startBtn { margin-top:6px; padding:15px 34px; font-size:16px; font-weight:700; color:#04140d;
    background:#5cff9e; border:none; border-radius:30px; box-shadow:0 6px 24px rgba(92,255,158,.35); }
  #startBtn:active{ transform:scale(.97); }
  #nosupport { color:#ff8a8a; font-size:13px; margin-top:8px; max-width:320px; }
  .hidden{ display:none!important; }
</style>
</head>
<body>

<div id="ver">v7 XR</div>

<div id="overlay" class="hidden">
  <div id="status">Iniciando AR...</div>
  <div id="hint">Apunta al piso y toca para colocar</div>

  <div id="panel">
    <div class="row">
      <label>Opacidad</label>
      <input type="range" id="opacity" min="0" max="100" value="100">
      <span class="val" id="opacityVal">100%</span>
    </div>
    <div class="row">
      <label>Altura</label>
      <input type="range" id="height" min="-50" max="100" value="0">
      <span class="val" id="heightVal">0</span>
    </div>
    <div class="btns">
      <button class="btn" id="replace">Recolocar</button>
      <button class="btn sec" id="loadBtn">Cargar archivo</button>
      <button class="btn sec" id="present">Presentar</button>
    </div>
    <div class="btns">
      <button class="btn sec" id="m-ghost">&#128123;</button>
      <button class="btn sec" id="m-duck">&#128036; Pato</button>
      <button class="btn sec" id="m-helmet">&#129686; Casco</button>
    </div>
    <input type="file" id="file" multiple>
  </div>
</div>

<button id="gear">&#9881;</button>
<div id="toast"></div>

<div id="start">
  <h1>&#128123; AR WebXR</h1>
  <p>AR real: apoya el objeto en una superficie, camina alrededor y velo desde todos los lados. Gestos: 1 dedo mueve, 2 dedos escala y rota.</p>
  <button id="startBtn">Iniciar AR</button>
  <div id="nosupport" class="hidden"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/XREstimatedLight.js"></script>
<script>
const $ = id => document.getElementById(id);
const toast = m => { const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1400); };
const status = m => { $('status').textContent = m; };

let renderer, scene, camera, reticle, content, defaultLight;
let hitTestSource=null, localSpace=null, viewerSpace=null;
let placed=false, materials=[];
let baseY=0, heightOffset=0;

/* ===== construir fantasma default ===== */
function buildGhost(){
  const g=new THREE.Group();
  const pts=[new THREE.Vector2(0,0),new THREE.Vector2(0.46,0.02),new THREE.Vector2(0.5,0.4),
    new THREE.Vector2(0.5,0.95),new THREE.Vector2(0.42,1.3),new THREE.Vector2(0.26,1.55),new THREE.Vector2(0,1.62)];
  const mat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x223355,emissiveIntensity:0.3,
    transparent:true,opacity:1,side:THREE.DoubleSide,roughness:0.9});
  g.add(new THREE.Mesh(new THREE.LatheGeometry(pts,40),mat));
  const dk=new THREE.MeshBasicMaterial({color:0x0a0a1a}); const eg=new THREE.SphereGeometry(0.09,16,16);
  const l=new THREE.Mesh(eg,dk); l.position.set(-0.16,1.15,0.44); g.add(l);
  const r=new THREE.Mesh(eg,dk); r.position.set(0.16,1.15,0.44); g.add(r);
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.08,16,16),dk); m.position.set(0,0.92,0.46); m.scale.set(1,1.3,0.6); g.add(m);
  // escalar a ~0.4 m para AR de mesa
  g.scale.setScalar(0.25);
  return g;
}

function collectMaterials(obj){
  materials=[];
  obj.traverse(o=>{ if(o.isMesh&&o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>materials.push(m)); });
  applyOpacity(+$('opacity').value/100);
}
function normalize(obj, targetH){
  let box=new THREE.Box3().setFromObject(obj), s=new THREE.Vector3(); box.getSize(s);
  const k=(targetH||0.4)/(Math.max(s.x,s.y,s.z)||1); obj.scale.setScalar(k);
  box=new THREE.Box3().setFromObject(obj); const c=new THREE.Vector3(); box.getCenter(c);
  obj.position.x-=c.x; obj.position.z-=c.z; obj.position.y-=box.min.y;
}
function setContent(obj){
  content.clear();
  content.add(obj);
  collectMaterials(obj);
  content.scale.setScalar(1); content.rotation.set(0,0,0);
}

/* ===== opacidad / altura ===== */
function applyOpacity(v){ materials.forEach(m=>{ m.transparent=v<0.999; m.opacity=v; m.needsUpdate=true; }); }
function applyHeight(){ if(placed) content.position.y = baseY + heightOffset; }

/* ===== init three + XR ===== */
async function startAR(){
  if(!navigator.xr){ noSupport('Este navegador no tiene WebXR. Usa Chrome actualizado.'); return; }
  const ok = await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);
  if(!ok){ noSupport('Tu equipo no soporta immersive-ar (ARCore). Revisa Google Play Services for AR.'); return; }

  renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(innerWidth,innerHeight);
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.xr.enabled=true;
  document.body.appendChild(renderer.domElement);
  renderer.domElement.style.position='fixed'; renderer.domElement.style.inset='0'; renderer.domElement.style.zIndex='1';

  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.01,20);

  defaultLight=new THREE.Group();
  const amb=new THREE.HemisphereLight(0xffffff,0x445566,1.0);
  const dir=new THREE.DirectionalLight(0xffffff,0.8); dir.position.set(0.5,1,0.25);
  defaultLight.add(amb,dir); scene.add(defaultLight);

  // estimacion de luz real (si esta disponible)
  if(typeof THREE.XREstimatedLight==='function'){
    const xrLight=new THREE.XREstimatedLight(renderer);
    xrLight.addEventListener('estimationstart',()=>{
      scene.add(xrLight); scene.remove(defaultLight);
      if(xrLight.environment) scene.environment=xrLight.environment;
    });
    xrLight.addEventListener('estimationend',()=>{
      scene.add(defaultLight); scene.remove(xrLight); scene.environment=null;
    });
  }

  // reticle
  const rg=new THREE.RingGeometry(0.07,0.09,32).rotateX(-Math.PI/2);
  reticle=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({color:0x5cff9e}));
  reticle.matrixAutoUpdate=false; reticle.visible=false; scene.add(reticle);

  content=new THREE.Group(); content.visible=false; scene.add(content);
  setContent(buildGhost());

  // sesion con DOM overlay + hit-test + luz
  let session;
  try{
    session=await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['hit-test'],
      optionalFeatures:['dom-overlay','light-estimation','local-floor'],
      domOverlay:{ root: $('overlay') }
    });
  }catch(e){ noSupport('No se pudo iniciar la sesion AR: '+e.message); return; }

  $('start').classList.add('hidden');
  $('overlay').classList.remove('hidden');

  await renderer.xr.setSession(session);
  localSpace=await session.requestReferenceSpace('local');
  viewerSpace=await session.requestReferenceSpace('viewer');
  hitTestSource=await session.requestHitTestSource({ space: viewerSpace });
  status('Buscando superficie...');

  // tap para colocar (solo si aun no esta colocado)
  session.addEventListener('select',()=>{
    if(!placed && reticle.visible){
      content.position.setFromMatrixPosition(reticle.matrix);
      baseY=content.position.y; heightOffset=0;
      $('height').value=0; $('heightVal').textContent='0';
      content.visible=true; placed=true;
      $('hint').classList.add('hidden');
      status('Colocado. Camina alrededor. Gestos: 1 dedo mueve, 2 escala/rota.');
      toast('Objeto colocado');
    }
  });

  session.addEventListener('end',()=>{
    $('overlay').classList.add('hidden'); $('start').classList.remove('hidden');
    $('gear').style.display='none'; placed=false; hitTestSource=null;
  });

  renderer.setAnimationLoop(render);
  setupGestures();
}

function render(t,frame){
  if(frame && hitTestSource && !placed){
    const res=frame.getHitTestResults(hitTestSource);
    if(res.length){
      const pose=res[0].getPose(localSpace);
      reticle.visible=true; reticle.matrix.fromArray(pose.transform.matrix);
      status('Superficie lista. Toca para colocar.');
    } else { reticle.visible=false; }
  } else { reticle.visible=false; }
  renderer.render(scene,camera);
}

/* ===== gestos: 1 dedo mueve, 2 dedos escala + rota ===== */
function setupGestures(){
  const ov=$('overlay');
  let mode=0, sx=0, sy=0, sDist=0, sAng=0, sScale=1, sRotY=0;
  const inUI = el => el.closest('#panel')||el.closest('button')||el.closest('input');

  ov.addEventListener('beforexrselect', e=>{ if(inUI(e.target)) e.preventDefault(); });

  ov.addEventListener('touchstart', e=>{
    if(!placed) return;
    if(inUI(e.target)) return;
    if(e.touches.length===1){ mode=1; sx=e.touches[0].clientX; sy=e.touches[0].clientY; }
    else if(e.touches.length===2){
      mode=2;
      const a=e.touches[0],b=e.touches[1];
      sDist=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);
      sAng=Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX);
      sScale=content.scale.x; sRotY=content.rotation.y;
    }
  },{passive:true});

  ov.addEventListener('touchmove', e=>{
    if(!placed||inUI(e.target)) return;
    if(mode===1 && e.touches.length===1){
      const dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
      sx=e.touches[0].clientX; sy=e.touches[0].clientY;
      // mover en el plano relativo a la camara
      const cam=renderer.xr.getCamera(camera);
      const fwd=new THREE.Vector3(); cam.getWorldDirection(fwd); fwd.y=0; fwd.normalize();
      const right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).normalize().multiplyScalar(-1);
      const k=0.0016;
      content.position.addScaledVector(right, dx*k);
      content.position.addScaledVector(fwd, -dy*k);
    } else if(mode===2 && e.touches.length===2){
      const a=e.touches[0],b=e.touches[1];
      const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);
      const ang=Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX);
      content.scale.setScalar(Math.min(6,Math.max(0.05,sScale*(d/sDist))));
      content.rotation.y = sRotY + (ang-sAng);
    }
  },{passive:true});

  ov.addEventListener('touchend', e=>{ if(e.touches.length===0) mode=0; },{passive:true});
}

/* ===== carga de modelos ===== */
function placeLoaded(obj){ normalize(obj,0.4); setContent(obj); if(placed) applyHeight(); toast('Modelo cargado'); }

function loadFiles(files){
  const map={}; let main=null, mainExt='';
  [...files].forEach(f=>{ const e=f.name.split('.').pop().toLowerCase(); map[f.name.toLowerCase()]=f;
    if(['glb','gltf','obj','stl'].includes(e)){ main=f; mainExt=e; } });
  if(!main){ toast('Elegi un .glb/.obj/.stl'); return; }
  toast('Cargando '+main.name+'...');
  const url=URL.createObjectURL(main);
  const texFile=[...files].find(f=>/\.(png|jpg|jpeg|webp)$/i.test(f.name));

  const onErr=e=>{ console.error(e); toast('Error al cargar'); };
  try{
    if(mainExt==='glb'||mainExt==='gltf'){
      new THREE.GLTFLoader().load(url,g=>{ placeLoaded(g.scene); URL.revokeObjectURL(url); },null,onErr);
    } else if(mainExt==='obj'){
      const finish=obj=>{
        if(texFile){
          const turl=URL.createObjectURL(texFile);
          new THREE.TextureLoader().load(turl,tex=>{
            tex.encoding=THREE.sRGBEncoding;
            obj.traverse(m=>{ if(m.isMesh){ m.material=new THREE.MeshStandardMaterial({map:tex,roughness:0.8}); } });
            placeLoaded(obj); URL.revokeObjectURL(turl); URL.revokeObjectURL(url);
          });
        } else {
          obj.traverse(m=>{ if(m.isMesh&&(!m.material||!m.material.isMeshStandardMaterial)) m.material=new THREE.MeshStandardMaterial({color:0xcccccc,roughness:0.8}); });
          placeLoaded(obj); URL.revokeObjectURL(url);
        }
      };
      new THREE.OBJLoader().load(url,finish,null,onErr);
    } else if(mainExt==='stl'){
      new THREE.STLLoader().load(url,geo=>{ geo.computeVertexNormals();
        placeLoaded(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xbfc4cc,roughness:0.6,metalness:0.1}))); URL.revokeObjectURL(url);
      },null,onErr);
    }
  }catch(e){ onErr(e); }
}

const SAMPLES={
  duck:'https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/Duck/glTF-Binary/Duck.glb',
  helmet:'https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/DamagedHelmet/glTF-Binary/DamagedHelmet.glb'
};
function loadSample(url,name){ toast('Cargando '+name+'...');
  new THREE.GLTFLoader().load(url,g=>placeLoaded(g.scene),null,e=>{console.error(e);toast('Error');}); }

function noSupport(msg){ const n=$('nosupport'); n.textContent=msg; n.classList.remove('hidden'); }

/* ===== UI ===== */
$('opacity').addEventListener('input',e=>{ const v=+e.target.value; $('opacityVal').textContent=v+'%'; applyOpacity(v/100); });
$('height').addEventListener('input',e=>{ const v=+e.target.value; $('heightVal').textContent=v; heightOffset=v/100; applyHeight(); });
$('replace').addEventListener('click',()=>{ placed=false; content.visible=false; $('hint').classList.remove('hidden'); status('Toca para recolocar.'); });
$('loadBtn').addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',e=>{ if(e.target.files.length) loadFiles(e.target.files); });
$('m-ghost').addEventListener('click',()=>{ setContent(buildGhost()); toast('Fantasma'); });
$('m-duck').addEventListener('click',()=>loadSample(SAMPLES.duck,'Pato'));
$('m-helmet').addEventListener('click',()=>loadSample(SAMPLES.helmet,'Casco'));
$('present').addEventListener('click',()=>{ $('panel').classList.add('hidden'); $('status').classList.add('hidden'); $('gear').style.display='block'; });
$('gear').addEventListener('click',()=>{ $('panel').classList.remove('hidden'); $('status').classList.remove('hidden'); $('gear').style.display='none'; });
$('startBtn').addEventListener('click',startAR);
</script>
</body>
</html>
